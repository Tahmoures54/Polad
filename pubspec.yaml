name: polad
description: صندوق خانوادگی پولاد — مدیریت قرض‌الحسنه خانوادگی
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.2.0
  go_router: ^16.2.4
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  meta: ^1.17.0

  firebase_core: ^4.1.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  firebase_messaging: ^16.0.1
  cloud_functions: ^6.0.1

  flutter_local_notifications: ^19.4.2
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.0.0

  persian_number_utility: ^1.1.6
  shamsi_date: ^1.1.1
  persian_datetime_picker: ^3.1.0

  fl_chart: ^1.1.1
  excel: ^4.0.6
  pdf: ^3.11.3
  printing: ^5.14.2

  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  permission_handler: ^12.0.1
  share_plus: ^12.0.0
  url_launcher: ^6.3.2
  file_picker: ^10.3.3
  dio: ^5.9.0
  crypto: ^3.0.6
  rxdart: ^0.28.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: VazirmatnFD
      fonts:
        - asset: assets/fonts/Vazirmatn-UI-FD-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-UI-FD-Bold.ttf
          weight: 700
